name: Linux AppImage

on:
  push:
    branches: ['AAGS-4.3.0-2.0.4']
    tags: ['v*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

env:
  QT_VERSION: 5.15.2

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt (Linux)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtcharts

      - name: Build deps (SDL2 + GStreamer dev)
        run: |
          sudo apt-get update
          # Ensure 'universe' is enabled (usually already on, but harmless to add)
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe

          # Install dev headers in one shot (note libunwind-dev first to satisfy deps)
          sudo apt-get install -y \
            build-essential ninja-build patchelf pkg-config \
            libgl1-mesa-dev \
            libunwind-dev \
            libsdl2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

          # Sanity checks
          pkg-config --modversion sdl2
          pkg-config --modversion gstreamer-1.0
          pkg-config --modversion gstreamer-video-1.0

      - name: Build AAGS
        run: |
          mkdir -p build && cd build
          qmake -r ../qgroundcontrol.pro CONFIG+=release CONFIG+=installer
          make -j$(nproc)

      - name: Package AppImage
        run: |
          set -e
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

          # AppDir layout
          mkdir -p AppDir/usr/bin
          cp build/staging/AAGS AppDir/usr/bin/AAGS
          chmod +x AppDir/usr/bin/AAGS

          # Generate a minimal desktop file
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/com.appliedaero.AAGS.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=AAGS
          Exec=AAGS
          Icon=com.appliedaero.AAGS
          Categories=Utility;Network;
          EOF

          # Create a placeholder 256x256 icon (transparent)
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          convert -size 256x256 canvas:none AppDir/usr/share/icons/hicolor/256x256/apps/com.appliedaero.AAGS.png

          # Build the AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage

          ls -lh ./*.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAGS-AppImage
          path: ./*.AppImage

      - name: Upload to S3 (optional)
        if: github.event_name == 'push'
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws s3 cp ./*.AppImage s3://aags/builds/${{ github.ref_name }}/ --region us-west-2 --acl public-read