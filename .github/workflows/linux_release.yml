name: Linux AppImage

on:
  push:
    branches: ['AAGS-4.3.0-2.0.4']
    tags: ['v*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

env:
  QT_VERSION: 5.15.2

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt (Linux)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtcharts

      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build patchelf \
              libgl1-mesa-dev \
              gstreamer1.0-tools gstreamer1.0-plugins-base \
              gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
              gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - name: Build AAGS
        run: |
          mkdir -p build && cd build
          qmake -r ../qgroundcontrol.pro CONFIG+=release CONFIG+=installer
          make -j$(nproc)

      - name: Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          mkdir -p AppDir/usr/bin
          cp build/staging/AAGS AppDir/usr/bin/
          # Optional: desktop/icon inside AppImage
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp deploy/linux/com.appliedaero.AAGS.desktop AppDir/usr/share/applications/
          cp deploy/icons/aags.png AppDir/usr/share/icons/hicolor/256x256/apps/com.appliedaero.AAGS.png
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          ls -lh ./*.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAGS-AppImage
          path: ./*.AppImage

      - name: Upload to S3 (optional)
        if: github.event_name == 'push'
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws s3 cp ./*.AppImage s3://aags/builds/${{ github.ref_name }}/ --region us-west-2 --acl public-read