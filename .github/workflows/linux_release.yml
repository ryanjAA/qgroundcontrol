name: Linux AppImage

on:
  push:
    branches: ['AAGS-4.3.0-2.0.4']
    tags: ['v*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

# Cancel in-progress runs for the same ref (saves time on rapid pushes)
concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 5.15.2
  # ccache location (cached across runs)
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Put cached Qt under the repo so actions/cache can persist it
  QT_DIR: ${{ github.workspace }}/.qt

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache Qt downloads (speeds up jurplel/install-qt-action)
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}
          restore-keys: |
            qt-${{ runner.os }}-

      - name: Install Qt (Linux)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtcharts
          dir: ${{ env.QT_DIR }}   # <= use cached dir
          cache: true              # <= allow action's internal cache, too

      # Cache ccache between runs
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build deps (SDL2 + GStreamer dev + tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe

          # Build & runtime deps
          sudo apt-get install -y \
            build-essential ninja-build patchelf pkg-config ccache \
            libgl1-mesa-dev libunwind-dev \
            libsdl2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            libspeechd2 speech-dispatcher \
            imagemagick wget

          # Use ccache
          echo 'export PATH="/usr/lib/ccache:$PATH"' >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ env.CCACHE_DIR }}" >> $GITHUB_ENV
          echo 'export CC="ccache gcc"' >> $GITHUB_ENV
          echo 'export CXX="ccache g++"' >> $GITHUB_ENV

          # Sanity checks
          pkg-config --modversion sdl2
          pkg-config --modversion gstreamer-1.0
          pkg-config --modversion gstreamer-video-1.0

      - name: Build AAGS
        run: |
          mkdir -p build && cd build
          # qmake picks up Qt from install-qt-action env (Qt5_DIR / QML2_IMPORT_PATH set by the action)
          qmake -r ../qgroundcontrol.pro CONFIG+=release CONFIG+=installer
          make -j"$(nproc)"

      - name: Package AppImage
        run: |
          set -euo pipefail
          set -x

          # Fetch linuxdeploy + qt plugin only if missing (saves a bit)
          test -f linuxdeploy-x86_64.AppImage || wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          test -f linuxdeploy-plugin-qt-x86_64.AppImage || wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

          # AppDir layout
          mkdir -p AppDir/usr/bin
          cp build/staging/AAGS AppDir/usr/bin/AAGS
          chmod +x AppDir/usr/bin/AAGS

          # Minimal desktop file
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/com.appliedaero.AAGS.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=AAGS
          Exec=AAGS
          Icon=com.appliedaero.AAGS
          Categories=Utility;Network;
          EOF

          # Placeholder 256x256 icon (you can replace later with your real icon)
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          convert -size 256x256 canvas:none AppDir/usr/share/icons/hicolor/256x256/apps/com.appliedaero.AAGS.png

          # Build the AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage

          ls -lh ./*.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAGS-AppImage
          path: ./*.AppImage

      - name: Upload to S3 (optional)
        if: github.event_name == 'push'
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws s3 cp ./*.AppImage s3://aags/builds/${{ github.ref_name }}/ --region us-west-2 --acl public-read