name: Windows Release

on:
  push:
    branches:
      - 'AAGS-4.3.0-2.0.4'
    paths:
      - '.github/workflows/windows_release.yml'
      - 'src/**'
      - 'custom/**'
      - '*.pro'
      - '*.pri'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

defaults:
  run:
    shell: cmd

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   5.15.2
  ARTIFACT:     AAGS-installer.exe
  GST_VERSION:  1.18.6
  BUILD_TYPE:   ${{ fromJSON('["DailyBuild", "StableBuild"]')[ github.ref_type == 'tag' || contains(github.ref, 'Stable_' ) ] }}

jobs:
  build:
    runs-on:  windows-2022

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f --depth 1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version:      ${{ env.QT_VERSION }}
          host:         windows
          target:       desktop
          arch:         win64_msvc2019_64
          dir:          ${{ runner.temp }}
          modules:      qtcharts
          setup-python: false

      - name: Download JOM
        uses: suisei-cn/actions-download-file@v1.6.0
        with:
          url:    http://download.qt.io/official_releases/jom/jom.zip
          target: ${{ runner.temp }}\

      - name: Unzip JOM
        working-directory: ${{ runner.temp }}
        run:  |
              7z x jom.zip -ojom

      - name: Download Gstreamer
        uses: suisei-cn/actions-download-file@v1.6.0
        with:
          url:    https://gstreamer.freedesktop.org/pkg/windows/${{ env.GST_VERSION }}/msvc/gstreamer-1.0-msvc-x86_64-${{ env.GST_VERSION }}.msi
          target: ${{ runner.temp }}\

      - name: Download Gstreamer dev
        uses: suisei-cn/actions-download-file@v1.6.0
        with:
          url:    https://gstreamer.freedesktop.org/pkg/windows/${{ env.GST_VERSION }}/msvc/gstreamer-1.0-devel-msvc-x86_64-${{ env.GST_VERSION }}.msi
          target: ${{ runner.temp }}\

      - name: Install Gstreamer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = "${{ runner.temp }}\gstreamer-1.0-msvc-x86_64-${{ env.GST_VERSION }}.msi"
          $devel   = "${{ runner.temp }}\gstreamer-1.0-devel-msvc-x86_64-${{ env.GST_VERSION }}.msi"
          # Pin the install root explicitly so we never have to guess where it landed.
          $installRoot = "C:\gstreamer"
          $gstRoot     = "$installRoot\1.0\msvc_x86_64"
          $gstLaunch   = "$gstRoot\bin\gst-launch-1.0.exe"

          foreach ($msi in @($runtime, $devel)) {
            if (-not (Test-Path $msi)) { Write-Host "::error::MSI missing: $msi"; exit 1 }
            $size = (Get-Item $msi).Length
            Write-Host "MSI $msi : $size bytes"
            if ($size -lt 1000000) { Write-Host "::error::MSI suspiciously small: $msi"; exit 1 }
          }

          function Dump-Log($log) {
            if (Test-Path $log) {
              Write-Host "===== $log (tail 300) ====="
              Get-Content $log -Tail 300
            } else {
              Write-Host "(no MSI log at $log)"
            }
          }

          function Install-Msi($msi) {
            $log = "${{ runner.temp }}\$(Split-Path $msi -Leaf).log"
            Write-Host "Installing $msi"
            # INSTALLDIR pins the location; /norestart so a pending reboot can't wedge CI.
            $p = Start-Process -FilePath msiexec.exe `
              -ArgumentList @("/i", "`"$msi`"", "/qn", "/norestart",
                              "ADDLOCAL=ALL", "INSTALLDIR=`"$installRoot`"",
                              "/l*v", "`"$log`"") `
              -Wait -PassThru
            $rc = $p.ExitCode
            Write-Host "msiexec exit code: $rc"
            # 0 = success, 3010 = success but reboot required (fine in CI). Anything
            # else is a real failure -> surface the MSI log immediately, don't mask it.
            if ($rc -ne 0 -and $rc -ne 3010) {
              Write-Warning "msiexec failed for $msi (exit $rc)"
              Dump-Log $log
            }
            return $rc
          }

          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "=== Install attempt $attempt / 3 ==="
            $rc1 = Install-Msi $runtime
            $rc2 = Install-Msi $devel

            $rcOk = ($rc1 -eq 0 -or $rc1 -eq 3010) -and ($rc2 -eq 0 -or $rc2 -eq 3010)
            if (Test-Path $gstLaunch) {
              if ($rcOk) { Write-Host "Found: $gstLaunch"; $ok = $true; break }
              # File present but msiexec reported a hard error: trust the error.
              Write-Warning "gst-launch present but msiexec failed (rc1=$rc1 rc2=$rc2)"
            }
            elseif ($rcOk) {
              # The exact symptom we keep hitting: msiexec returns success but the
              # tree is not there. Dump the runtime MSI log right now so the real
              # cause is visible in the failing run instead of a vague message.
              Write-Warning "msiexec reported success but $gstLaunch is missing"
              Dump-Log "${{ runner.temp }}\$(Split-Path $runtime -Leaf).log"
              Write-Host "=== Listing $installRoot ==="
              if (Test-Path $installRoot) {
                Get-ChildItem $installRoot -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 50 FullName | Format-Table -AutoSize | Out-String | Write-Host
              } else {
                Write-Host "(install root $installRoot does not exist)"
              }
            }

            Write-Warning "Attempt $attempt failed (rc1=$rc1 rc2=$rc2 launch=$(Test-Path $gstLaunch))"
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }

          if (-not $ok) {
            Write-Host "=== Full filesystem search ==="
            Get-ChildItem -Path C:\ -Filter gst-launch-1.0.exe -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "FOUND: $($_.FullName)" }
            Write-Host "::error::GStreamer install failed (see MSI log tail above)"
            exit 1
          }

          Write-Host "GStreamer root: $gstRoot"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Verify Gstreamer install
        run: |
          dir "%GSTREAMER_1_0_ROOT_MSVC_X86_64%\bin"
          if not exist "%GSTREAMER_1_0_ROOT_MSVC_X86_64%\bin\gst-launch-1.0.exe" exit /b 1

      - name: Add Gstreamer to PATH
        run: echo %GSTREAMER_1_0_ROOT_MSVC_X86_64%\bin>> %GITHUB_PATH%

      - name: Create build directory
        run:  mkdir ${{ runner.temp }}\shadow_build_dir

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Build
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run:  |
              qmake -r ${{ env.SOURCE_DIR }}\qgroundcontrol.pro CONFIG+=installer CONFIG+=${{ env.BUILD_TYPE }}
              ${{ runner.temp }}\jom\jom -j2


      - name: Bundle GStreamer runtime into staging
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: |
              if not exist staging\ ( echo ERROR: staging\ does not exist after build & exit /b 1 )
              if exist staging\${{ env.ARTIFACT }} del /f /q staging\${{ env.ARTIFACT }}
              echo Copying GStreamer runtime DLLs into staging\ ...
              xcopy /Y /I "%GSTREAMER_1_0_ROOT_MSVC_X86_64%\bin\*.dll" "staging\"
              if errorlevel 1 ( echo ERROR: failed copying GStreamer bin DLLs & exit /b 1 )
              echo Copying GStreamer plugins into staging\gstreamer-plugins\ ...
              if not exist staging\gstreamer-plugins\ mkdir staging\gstreamer-plugins
              xcopy /Y /I "%GSTREAMER_1_0_ROOT_MSVC_X86_64%\lib\gstreamer-1.0\*.dll" "staging\gstreamer-plugins\"
              if errorlevel 1 ( echo ERROR: failed copying GStreamer plugins & exit /b 1 )
              if not exist "staging\gstreamer-1.0-0.dll" ( echo ERROR: gstreamer-1.0-0.dll missing from staging & exit /b 1 )
              dir /b staging\gstreamer-plugins | findstr /i ".dll" >nul || ( echo ERROR: no plugin DLLs in staging\gstreamer-plugins & exit /b 1 )

      - name: Re-build NSIS installer with bundled GStreamer
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run: |
              "C:\Program Files (x86)\NSIS\makensis.exe" /DDRIVER_MSI="${{ env.SOURCE_DIR }}\deploy\windows\driver.msi" /DINSTALLER_ICON="${{ env.SOURCE_DIR }}\deploy\windows\WindowsQGC.ico" /DHEADER_BITMAP="${{ env.SOURCE_DIR }}\deploy\windows\installheader.bmp" /DAPPNAME="AAGS" /DEXENAME="AAGS" /DORGNAME="AppliedAeronautics" /DDESTDIR=staging /NOCD "/XOutFile staging\${{ env.ARTIFACT }}" "${{ env.SOURCE_DIR }}\deploy\windows\nullsoft_installer.nsi"
              if not exist staging\${{ env.ARTIFACT }} ( echo ERROR: installer not produced & exit /b 1 )

      - name: Verify installer bundled GStreamer
        working-directory: ${{ runner.temp }}\shadow_build_dir
        shell: powershell
        run: |
              $size = (Get-Item "staging\${{ env.ARTIFACT }}").Length
              Write-Host "Installer size: $size bytes ($([math]::Round($size/1MB,1)) MB)"
              if ($size -lt 50000000) {
                Write-Error "Installer is under 50MB - GStreamer was likely NOT bundled"
                exit 1
              }

      - name: Save installer artifact
        uses: actions/upload-artifact@master
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}\shadow_build_dir\staging\${{ env.ARTIFACT }}

      - name: Save PDB artifact
        uses: actions/upload-artifact@master
        with:
          name: aags.pdb
          path: ${{ runner.temp }}\shadow_build_dir\staging\aags.pdb

      - name: Upload build to S3 Bucket
        if:                 github.event_name == 'push'
        working-directory:  ${{ runner.temp }}\shadow_build_dir\staging
        run: |
              aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws s3 cp ${{ env.ARTIFACT }} s3://aags/builds/${{ github.ref_name }}/${{ env.ARTIFACT }} --region us-west-2 --acl public-read

      - name: Upload tagged stable build to S3 latest Bucket
        if:                 github.event_name == 'push' && github.ref_type == 'tag'
        working-directory:  ${{ runner.temp }}\shadow_build_dir\staging
        run: |
              aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws s3 cp ${{ env.ARTIFACT }} s3://aags/latest/${{ env.ARTIFACT }} --region us-west-2 --acl public-read